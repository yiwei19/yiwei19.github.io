<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.data.bio.name }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>

    </nav>
  </div>
</header>
